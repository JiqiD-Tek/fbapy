networks:
  fba-network:
    name: fba-network        # 固定网络名，避免多项目冲突
    driver: bridge

services:
  # ------------------------
  # MySQL 数据库
  # ------------------------
  mysql:
    image: mysql
    container_name: mysql
    restart: unless-stopped
    privileged: true
    mem_limit: 8g
    cpus: 2.0
    ports:
      - "3306:3306"  # 映射宿主机 3306
    environment:
      MYSQL_DATABASE: fba
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4      # 支持 emoji
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_ROOT}/mysql/log:/var/log/mysql
      - ${DATA_ROOT}/mysql/data:/var/lib/mysql
      - ${DATA_ROOT}/mysql/conf.d:/etc/mysql/conf.d
      - /etc/localtime:/etc/localtime:ro   # 同步宿主机时间
    networks:
      - fba-network

  # ------------------------
  # Redis 缓存
  # ------------------------
  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    privileged: true
    mem_limit: 2g
    cpus: 1.0
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DATA_ROOT}/redis/data:/data
    networks:
      - fba-network

  # ------------------------
  # Nginx 代理
  # ------------------------
  nginx:
    image: nginx
    container_name: nginx
    restart: unless-stopped
    privileged: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_PORT=80
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ${DATA_ROOT}/nginx/html:/usr/share/nginx/html
      - ${DATA_ROOT}/nginx/logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 支持容器访问宿主机
    networks:
      - fba-network

  # ------------------------
  # MQTT 服务器（EMQX 企业版）
  # ------------------------
  emqx:
    image: emqx/emqx-enterprise:5.10.1-rc.2
    container_name: emqx
    restart: unless-stopped
    privileged: true
    mem_limit: 6g
    cpus: 2.0
    environment:
      EMQX_NODE_NAME: ${EMQX_NODE_NAME}
      EMQX_LISTENERS__TCP__DEFAULT__BIND: 0.0.0.0:1883
      EMQX_LISTENERS__SSL__DEFAULT__BIND: 0.0.0.0:8883
      EMQX_LISTENERS__WS__DEFAULT__BIND: 0.0.0.0:8083
      EMQX_LISTENERS__WSS__DEFAULT__BIND: 0.0.0.0:8084
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "1883:1883"    # MQTT TCP
      - "8083:8083"    # MQTT WebSocket
      - "8084:8084"    # MQTT WebSocket SSL
      - "8883:8883"    # MQTT SSL
      - "18083:18083"  # Dashboard
    volumes:
      - ${DATA_ROOT}/emqx/data:/opt/emqx/data
      - ${DATA_ROOT}/emqx/log:/opt/emqx/log
    networks:
      - fba-network

  # ------------------------
  # 后端服务 fbapy
  # ------------------------
  fbapy:
    image: fbapy:latest
    container_name: fbapy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    volumes:
      - .env.server:/fbapy/backend/.env:ro
      - ${DATA_ROOT}/fbapy/log:/var/log/fba
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8000:8000"
    networks:
      - fba-network
    command:
      - bash
      - -c
      - |
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  # ------------------------
  # LiveKit Server(主机网络)
  # ------------------------
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 12g
    network_mode: "host"  # 使用 host 网络模式解决端口映射问题
    volumes:
      - ./livekit.yaml:/livekit.yaml   # 配置文件（Key / RTC / Redis）
    command: >
      --config /livekit.yaml
      ${LIVEKIT_FLAGS}
    depends_on:
      - redis     # 依赖 Redis 用于房间管理、状态协调

  # ------------------------
  # TURN Server (主机网络)
  # ------------------------
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    network_mode: "host"  # 使用 host 网络模式解决端口映射问题
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
      - ${DATA_ROOT}/coturn/privkey.pem:/etc/ssl/private/privkey.pem:ro
      - ${DATA_ROOT}/coturn/cert.pem:/etc/ssl/certs/cert.pem:ro
