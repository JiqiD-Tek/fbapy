# 基础进程配置
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    # 基础日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # 性能基础配置
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # 基础压缩配置
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 上游服务
    upstream fba_server {
        server host.docker.internal:8001;
    }

    # 代理通用配置
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 安全响应头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # ==================== iot.jiqid.net 服务配置 ====================
    server {
        listen 443 ssl;
        server_name iot.jiqid.net;

        # SSL 配置
        ssl_certificate /usr/share/nginx/html/ssl/jiqid.net/fullchain.pem;
        ssl_certificate_key /usr/share/nginx/html/ssl/jiqid.net/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 所有路由统一处理
        location / {
            proxy_pass http://fba_server;

            # 添加 WebSocket 支持头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 错误处理
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name iot.jiqid.net;
        return 301 https://$server_name$request_uri;
    }

    # ==================== iot.jiqid.com 服务配置 ====================
    server {
        listen 443 ssl;
        server_name iot.jiqid.com;

        # SSL 配置
        ssl_certificate /usr/share/nginx/html/ssl/jiqid.com/fullchain.pem;
        ssl_certificate_key /usr/share/nginx/html/ssl/jiqid.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 所有路由统一处理
        location / {
            proxy_pass http://fba_server;

            # 添加 WebSocket 支持头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 错误处理
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name iot.jiqid.com;
        return 301 https://$server_name$request_uri;
    }

    # 默认服务器拒绝访问
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}