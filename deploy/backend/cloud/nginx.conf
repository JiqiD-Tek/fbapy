    # ==================== 官网配置 ====================
    server {
        listen 443 ssl;
        server_name www.jiqid.com;

        ssl_certificate /usr/share/nginx/html/ssl/jiqid.com/fullchain.pem;
        ssl_certificate_key /usr/share/nginx/html/ssl/jiqid.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

         # API代理
        location ~ ^/(captcha|validate|mitu|sys|get_downld_url|get_pl_list)(?:/|$) {
            proxy_pass http://120.92.88.7$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
        }

        # 静态资源
        location / {
            try_files $uri $uri/ /index.html;
            root /usr/share/nginx/html/jiqid/dist/;

            # 强缓存静态资源
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            # HTML文件不缓存
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
    # ==================== 域名重定向 ====================
    server {
        listen 80;
        server_name www.jiqid.com jiqid.com m.jiqid.com cloud.jiqid.com;
        return 301 https://www.jiqid.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name jiqid.com m.jiqid.com cloud.jiqid.com;

