worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream xiaozhi_js61cn_server {
        server host.docker.internal:8000;
    }

    upstream xiaozhi_k11cn_server {
        server host.docker.internal:8000;
    }

    upstream xiaozhi_k11tw_server {
        server host.docker.internal:8000;
    }

    upstream xiaozhi_k11us_server {
        server host.docker.internal:8000;
    }

    upstream fba_server {
        server host.docker.internal:8001;
    }

    upstream audio_server {
        server host.docker.internal:8011;
    }

    upstream emqx_ws_server {
        server host.docker.internal:8083;
    }

    map $xiaozhi_model $xiaozhi_upstream {
        js61cn xiaozhi_js61cn_server;
        k11cn xiaozhi_k11cn_server;
        k11tw xiaozhi_k11tw_server;
        k11us xiaozhi_k11us_server;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    server {
        listen 443 ssl;
        server_name iot.jiqid.net;

        ssl_certificate /usr/share/nginx/html/ssl/jiqid.net/fullchain.pem;
        ssl_certificate_key /usr/share/nginx/html/ssl/jiqid.net/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location ~ ^/xiaozhi/(?<xiaozhi_model>js61cn|k11cn|k11tw|k11us)(?:/(?<xiaozhi_path>.*))?$ {
            proxy_pass http://$xiaozhi_upstream/xiaozhi/$xiaozhi_path$is_args$args;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        # todo 删除
        location ^~ /xiaozhi/v1/ {
            proxy_pass http://xiaozhi_js61cn_server;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location = /mqtt {
            proxy_pass http://emqx_ws_server/mqtt;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            proxy_buffering off;
        }

        location ~ ^/api/v1/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;

            proxy_pass http://fba_server;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        location = / {
            return 301 /fbaui/;
        }

        location = /fbaui {
            return 301 /fbaui/;
        }

        location ^~ /fbaui/ {
            alias /usr/share/nginx/html/fbaui/dist/;
            try_files $uri $uri/ /fbaui/index.html;
        }

        location = /k11_h5 {
            return 301 /k11_h5/;
        }

        location ^~ /k11_h5/ {
            alias /usr/share/nginx/html/k11_h5/dist/;
            try_files $uri $uri/ /k11_h5/index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    server {
        listen 80;
