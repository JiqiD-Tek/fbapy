networks:
  fba-network:
    name: fba-network        # 固定网络名，避免多项目冲突
    driver: bridge

services:
  fba_mysql:
    image: mysql
    container_name: fba_mysql
    restart: always
    cpus: 1.0
    mem_limit: 2048m
    ports:
      - "${DOCKER_MAP_MYSQL_PORT:-3306}:3306"  # 映射宿主机 3306
    environment:
      MYSQL_DATABASE: fba
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4      # 支持 emoji
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_ROOT}/mysql/log:/var/log/mysql
      - ${DATA_ROOT}/mysql/data:/var/lib/mysql
      - ${DATA_ROOT}/mysql/conf.d:/etc/mysql/conf.d
      - /etc/localtime:/etc/localtime:ro   # 同步宿主机时间
    networks:
      - fba-network

  fba_redis:
    image: redis
    container_name: fba_redis
    restart: always
    cpus: 1.0
    mem_limit: 2048m
    ports:
      - "${DOCKER_MAP_REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --bind 0.0.0.0
    volumes:
      - ${DATA_ROOT}/redis/data:/data
    networks:
      - fba-network

  fba_rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:3.9.7-management
    ports:
      - "${DOCKER_MAP_RABBITMA_UI_PORT:-15672}:15672"
      - "${DOCKER_MAP_RABBITMA_PORT:-5672}:5672"
    container_name: fba_rabbitmq
    restart: always
    cpus: 0.5
    mem_limit: 2048m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ${DATA_ROOT}/rabbitmq:/var/lib/rabbitmq
    networks:
      - fba-network

  fba_tsdb:
    image: tdengine/tsdb:latest
    container_name: fba_tsdb
    hostname: tsdb
    restart: always
    cpus: 1.5
    mem_limit: 2048m
    ports:
      - "${DOCKER_MAP_TSDB_PORT_6030:-6030}:6030"
      - "${DOCKER_MAP_TSDB_PORT_6041:-6041}:6041"
      - "${DOCKER_MAP_TSDB_PORT_6043:-6043}:6043"
      - "${DOCKER_MAP_TSDB_PORT_6060:-6060}:6060"
      - "${DOCKER_MAP_TSDB_PORT_RANGE_TCP:-6044-6049}:6044-6049"
      - "${DOCKER_MAP_TSDB_PORT_RANGE_UDP:-6044-6045}:6044-6045/udp"
    environment:
      TZ: Asia/Shanghai
      TAOS_ROOT_PASSWORD: ${TSDB_ROOT_PASSWORD}
      EXPLORER_SKIP_REGISTER: ${TSDB_EXPLORER_SKIP_REGISTER:-true}
    volumes:
      - ${DATA_ROOT}/tdengine/log:/var/log/taos
      - ${DATA_ROOT}/tdengine/data:/var/lib/taos
      - /etc/localtime:/etc/localtime:ro
    networks:
      - fba-network

  fba_emqx:
    image: emqx/emqx-enterprise:6.2.0
    container_name: fba_emqx
    restart: always
    cpus: 1.5
    mem_limit: 2048m
    environment:
      EMQX_NODE_NAME: ${EMQX_NODE_NAME}
      EMQX_LISTENERS__TCP__DEFAULT__BIND: 0.0.0.0:1883
      EMQX_LISTENERS__SSL__DEFAULT__BIND: 0.0.0.0:8883
      EMQX_LISTENERS__WS__DEFAULT__BIND: 0.0.0.0:8083
      EMQX_LISTENERS__WSS__DEFAULT__BIND: 0.0.0.0:8084
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "1883:1883"    # MQTT TCP
      - "8083:8083"    # MQTT WebSocket
      - "8084:8084"    # MQTT WebSocket SSL
      - "8883:8883"    # MQTT SSL
      - "18083:18083"  # Dashboard
    volumes:
      - ${DATA_ROOT}/emqx/data:/opt/emqx/data
      - ${DATA_ROOT}/emqx/log:/opt/emqx/log
    networks:
      - fba-network

  fba_nginx:
    image: nginx:latest
    container_name: fba_nginx
    restart: always
    cpus: 1.0
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_NGINX_PORT:-80}:80"
      - "${DOCKER_MAP_NGINX_SSL_PORT:-443}:443"
    environment:
      - NGINX_PORT=80
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ${DATA_ROOT}/nginx/html:/usr/share/nginx/html
      - ${DATA_ROOT}/nginx/logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 支持容器访问宿主机
    networks:
      - fba-network

  fba_loki:
    image: grafana/loki:k289-533b1f0
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_LOKI_PORT:-3100}:3100"
    container_name: fba_loki
    networks:
      - fba-network
    command: -config.file=/etc/loki/local-config.yaml

  fba_prometheus:
    image: prom/prometheus:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_PROMETHEUS_PORT:-9090}:9090"
    container_name: fba_prometheus
    depends_on:
      - fba_loki
    volumes:
      - ../grafana/fba_prometheus.yml:/workspace/fba_prometheus.yml
      - ${DATA_ROOT}/prometheus:/prometheus
    networks:
      - fba-network
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --config.file=/workspace/fba_prometheus.yml

  fba_alloy:
    image: grafana/alloy:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_ALLOY_GRPC_PORT:-4317}:4317"
      - "${DOCKER_MAP_ALLOY_HTTP_PORT:-4318}:4318"
      - "${DOCKER_MAP_ALLOY_UI_PORT:-12345}:12345"
    container_name: fba_alloy
    depends_on:
      - fba_loki
    volumes:
      - ../grafana/fba_config.alloy:/etc/alloy/fba_config.alloy
    networks:
      - fba-network
    command:
      - run
      - /etc/alloy/fba_config.alloy
      - --server.http.listen-addr=0.0.0.0:12345

  fba_tempo:
    image: grafana/tempo:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_TEMPO_PORT:-3200}:3200"
    expose:
      - 4317
      - 4318
    container_name: fba_tempo
    depends_on:
      - fba_loki
    volumes:
      - ../grafana/fba_tempo.yml:/etc/tempo/fba_tempo.yml
    networks:
      - fba-network
    command:
      - -config.file=/etc/tempo/fba_tempo.yml
      - -auth.enabled=false

  fba_grafana:
    image: grafana/grafana:nightly-ubuntu
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_GRAFANA_PORT:-3000}:3000"
    container_name: fba_grafana
    depends_on:
      - fba_loki
      - fba_prometheus
    volumes:
      - ../grafana/fba_grafana.ini:/etc/grafana/grafana.ini
      - ../grafana/dashboards/fba_celery.json:/etc/grafana/dashboards/fba_celery.json
      - ../grafana/dashboards/fba_server.json:/etc/grafana/dashboards/fba_server.json
      - ../grafana/fba_dashboards.yml:/etc/grafana/provisioning/dashboards/fba_dashboards.yml
      - ../grafana/fba_datasource.yml:/etc/grafana/provisioning/datasources/fba_datasource.yml
    networks:
      - fba-network

  fba_celery_exporter:
    image: danihodovic/celery-exporter:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    ports:
      - "${DOCKER_MAP_CELERY_EXPORTER_PORT:-9808}:9808"
    container_name: fba_celery_exporter
    environment:
      - CE_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@fba_rabbitmq:5672//
    depends_on:
      - fba_rabbitmq
    networks:
      - fba-network

  fba_server:
    image: fba_server:${IMAGE_VERSION:-latest}
    container_name: fba_server
    restart: always
    cpus: 1.0
    mem_limit: 2048m
    volumes:
      - .env.server:/fba/backend/.env:ro
      - ${DATA_ROOT}/fba/log:/var/log/fba
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${DOCKER_MAP_FBA_PORT:-8001}:8001"
    command: >
      supervisord -n -c /etc/supervisor/supervisord.conf
    networks:
      - fba-network
